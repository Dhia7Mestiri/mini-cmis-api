<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMIS 1.1 Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <!-- Header -->
        <header class="pb-3 mb-4 border-bottom d-flex justify-content-between align-items-center">
            <h1 class="h4 m-0">📁 CMIS 1.1 Explorer</h1>
            <div class="d-flex align-items-center gap-2">
                <span id="health-badge" class="badge bg-secondary">Checking System Health...</span>
                <span id="user-status" class="badge bg-dark">Not Authenticated</span>
            </div>
        </header>

        <!-- Access / Authentication Bar -->
        <div class="card p-3 mb-4 shadow-sm bg-white">
            <div class="row g-2 align-items-center">
                <div class="col-md-5">
                    <input type="email" id="email" class="form-control" placeholder="Email (e.g. admin@cmis.com)">
                </div>
                <div class="col-md-5">
                    <input type="password" id="password" class="form-control" placeholder="Password (e.g. AdminPass123!)">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" onclick="login()">Authenticate 🔑</button>
                </div>
            </div>
        </div>

        <!-- Explorer View -->
        <div class="row g-4">
            <!-- Left Controls Column -->
            <div class="col-md-4">
                <!-- Search Card -->
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title h6 fw-bold">🔍 Search Repository</h5>
                        <div class="input-group">
                            <input type="text" id="searchInput" class="form-control" placeholder="Search files...">
                            <button class="btn btn-outline-primary" onclick="searchObjects()">Search</button>
                        </div>
                    </div>
                </div>

                <!-- Create Folder Card -->
                <div class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title h6 fw-bold">➕ Create Folder</h5>
                        <input type="text" id="folderName" class="form-control mb-2" placeholder="Folder Name">
                        <button class="btn btn-success w-100" onclick="createFolder()">Create Folder</button>
                    </div>
                </div>

                <!-- 📄 Upload Document Card -->
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title h6 fw-bold">📄 Upload Document</h5>
                        <input type="text" id="docName" class="form-control mb-2" placeholder="Custom Name (optional)">
                        <input type="file" id="fileInput" class="form-control mb-3">
                        <button class="btn btn-primary w-100" onclick="uploadDocument()">Upload File</button>
                    </div>
                </div>
            </div>

            <!-- Right Objects List Column -->
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="m-0 h6 fw-bold" id="currentFolderTitle">Current Folder: root-folder</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadChildren('root-folder')">Home 🏠</button>
                    </div>
                    <div class="card-body">
                        <ul class="list-group" id="objectList">
                            <li class="list-group-item text-muted">Please authenticate to view repository contents.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const repoId = "mini-cmis-repo";
        let currentFolderId = "root-folder";

        function getAuthHeaders() {
            const token = localStorage.getItem('token');
            return token ? { 'Authorization': `Bearer ${token}` } : {};
        }

        async function checkHealth() {
            try {
                const res = await fetch('/health');
                const badge = document.getElementById('health-badge');
                if (res.ok) {
                    badge.className = 'badge bg-success';
                    badge.innerText = 'System Operational';
                } else {
                    badge.className = 'badge bg-danger';
                    badge.innerText = 'Unhealthy';
                }
            } catch {
                document.getElementById('health-badge').className = 'badge bg-danger';
                document.getElementById('health-badge').innerText = 'Offline';
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                // ✅ Tell .NET 8 Identity API to return a Bearer accessToken JSON
                body: JSON.stringify({ email: email, password: password })
            });

            if (res.ok) {
                const data = await res.json();
                // .NET 8 Identity API returns 'accessToken'
                if (data.accessToken) {
                    localStorage.setItem('token', data.accessToken);
                    localStorage.setItem('email', email);
                    document.getElementById('user-status').className = 'badge bg-primary';
                    document.getElementById('user-status').innerText = `Active: ${email}`;
                    loadChildren('root-folder');
                } else {
                    alert('Login succeeded, but no access token was returned.');
                }
            } else {
                alert('Authentication failed. Verify account credentials.');
            }
        }

        async function loadChildren(folderId) {
            currentFolderId = folderId;
            document.getElementById('currentFolderTitle').innerText = `Current Folder: ${folderId}`;

            const res = await fetch(`/browser/${repoId}/${folderId}?cmisselector=children`, {
                headers: getAuthHeaders()
            });

            if (res.status === 401) {
                document.getElementById('objectList').innerHTML = '<li class="list-group-item text-danger">401 Unauthorized. Authenticate above.</li>';
                return;
            }

            const data = await res.json();
            const list = document.getElementById('objectList');
            list.innerHTML = '';

            if (!data.objects || data.objects.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted">Folder is empty</li>';
                return;
            }

            data.objects.forEach(item => {
                const isFolder = item.typeId === 'cmis:folder';
                const icon = isFolder ? '📁' : '📄';
                const li = document.createElement('li');
                li.className = 'list-group-item d-flex justify-content-between align-items-center';

                li.innerHTML = `
        <span>${icon} <strong>${item.name}</strong></span>
        <div>
            ${isFolder ? `<button class="btn btn-sm btn-info me-2" onclick="loadChildren('${item.id}')">Open</button>` : ''}
            ${!isFolder ? `<button class="btn btn-sm btn-primary me-2" onclick="downloadFile('${item.id}', '${item.name}')">Download</button>` : ''}
            <button class="btn btn-sm btn-danger" onclick="deleteObject('${item.id}')">Delete</button>
        </div>
    `;
                list.appendChild(li);
            });
        }

        async function createFolder() {
            const name = document.getElementById('folderName').value;
            if (!name) return;
            const formData = new FormData();
            formData.append('cmisaction', 'createFolder');
            formData.append('name', name);

            const res = await fetch(`/browser/${repoId}/${currentFolderId}`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: formData
            });

            if (res.ok) {
                document.getElementById('folderName').value = '';
                loadChildren(currentFolderId);
            } else if (res.status === 401) {
                alert('Not Authorized: Please authenticate first.');
            } else if (res.status === 403) {
                alert('Permission Denied (403): Your role does not allow folder creation.');
            } else {
                alert('Operation failed.');
            }
        }

        async function uploadDocument() {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('Please select a file to upload.');
                return;
            }

            const docName = document.getElementById('docName').value;
            const formData = new FormData();
            formData.append('cmisaction', 'createDocument');
            formData.append('file', fileInput.files[0]);
            if (docName) {
                formData.append('name', docName);
            }

            const res = await fetch(`/browser/${repoId}/${currentFolderId}`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: formData
            });

            if (res.ok) {
                document.getElementById('docName').value = '';
                fileInput.value = '';
                loadChildren(currentFolderId);
            } else if (res.status === 401) {
                alert('Not Authorized: Please authenticate first.');
            } else if (res.status === 403) {
                alert('Permission Denied (403): Your role does not allow uploading documents.');
            } else {
                alert('File upload failed.');
            }
        }

        async function deleteObject(id) {
            const formData = new FormData();
            formData.append('cmisaction', 'delete');

            const res = await fetch(`/browser/${repoId}/${id}`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: formData
            });

            if (res.ok) {
                loadChildren(currentFolderId);
            } else if (res.status === 403) {
                alert('Permission Denied (403): Deletion requires Admin privileges.');
            }
        }
        async function downloadFile(objectId, fileName) {
            try {
                const res = await fetch(`/browser/${repoId}/${objectId}?cmisselector=content`, {
                    headers: getAuthHeaders() // Attaches Bearer token
                });

                if (res.status === 401) {
                    alert('Unauthorized: Please authenticate first.');
                    return;
                }

                if (!res.ok) {
                    alert('Failed to download file or content is missing.');
                    return;
                }

                // Convert response to binary Blob and trigger browser download
                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName || 'downloaded-file';
                document.body.appendChild(a);
                a.click();

                // Cleanup
                a.remove();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                alert(`Download error: ${err.message}`);
            }
        }

        async function restoreSession() {
            const token = localStorage.getItem('token');
            const savedEmail = localStorage.getItem('email');
            if (!token) return;

            document.getElementById('user-status').className = 'badge bg-primary';
            document.getElementById('user-status').innerText = `Active: ${savedEmail || 'session restored'}`;

            const res = await fetch(`/browser/${repoId}/root-folder?cmisselector=children`, {
                headers: getAuthHeaders()
            });

            if (res.status === 401) {
                // Token expired or invalid — clear stale session
                localStorage.removeItem('token');
                localStorage.removeItem('email');
                document.getElementById('user-status').className = 'badge bg-dark';
                document.getElementById('user-status').innerText = 'Not Authenticated';
                document.getElementById('objectList').innerHTML = '<li class="list-group-item text-danger">Session expired. Please re-authenticate.</li>';
                return;
            }

            loadChildren('root-folder');
        }

        async function searchObjects() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;

            const res = await fetch(`/browser?cmisselector=query&q=${encodeURIComponent(query)}`, {
                headers: getAuthHeaders()
            });

            if (res.ok) {
                const data = await res.json();
                const list = document.getElementById('objectList');
                list.innerHTML = '';

                if (!data.results || data.results.length === 0) {
                    list.innerHTML = '<li class="list-group-item text-muted">No matching results found</li>';
                    return;
                }

                data.results.forEach(item => {
                    const isFolder = item.typeId === 'cmis:folder';
                    const icon = isFolder ? '📁' : '📄';
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `
                            <span>${icon} <strong>${item.name}</strong> <small class="text-muted">(${item.path})</small></span>
                            <div>
                                ${!isFolder ? `<a href="/browser/${repoId}/${item.id}?cmisselector=content" class="btn btn-sm btn-primary me-2" target="_blank">Download</a>` : ''}
                            </div>
                        `;
                    list.appendChild(li);
                });
            }
        }

        checkHealth();
        restoreSession(); 
    </script>
</body>
</html>
